<!doctype html>
{% load static %}
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portfolio AI{% endblock %}</title>
  
  <!-- Google Fonts - Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons & Third Party CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  
  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen font-sans flex flex-col">
  {% include 'components/navbar.html' %}
  
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    {% include 'components/messages.html' %}
    {% block content %}{% endblock %}
  </main>
  
  {% include 'components/footer.html' %}
  
  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="{% static 'js/dashboard.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize progress bar widths dynamically
      document.querySelectorAll('.progress-bar').forEach(bar => {
        const val = bar.getAttribute('aria-valuenow');
        if (val !== null) {
          bar.style.width = val + '%';
        }
      });

      // Password visibility toggler global logic
      const togglers = document.querySelectorAll('.toggle-password');
      togglers.forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const targetId = btn.getAttribute('data-toggle-target');
          const targetInput = document.getElementById(targetId);
          if (targetInput) {
            const icon = btn.querySelector('i');
            if (targetInput.type === 'password') {
              targetInput.type = 'text';
              if (icon) {
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
              }
            } else {
              targetInput.type = 'password';
              if (icon) {
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
              }
            }
          }
        });
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
