{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<!-- Mobile Sidebar Toggler Bar (Visible on mobile/tablet, hidden on desktop lg) -->
<div class="lg:hidden flex items-center justify-between mb-4 bg-white/85 backdrop-blur border border-slate-200/80 p-3.5 rounded-xl shadow-sm">
  <div class="flex items-center gap-2">
    <i class="bi bi-grid-fill text-blue-600"></i>
    <span class="text-xs font-bold text-slate-800 tracking-wide font-sans">Dashboard Navigation</span>
  </div>
  <button id="mobile-sidebar-open" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold shadow-sm transition-colors cursor-pointer">
    <i class="bi bi-list"></i> Open Menu
  </button>
</div>

<!-- Main Layout Grid Wrapper -->
<div class="grid grid-cols-1 lg:grid-cols-4 gap-8 relative">
  
  <!-- Sidebar Container -->
  <!-- Mobile: slide-in drawer. Desktop: normal grid column. -->
  <div id="sidebar-container" class="fixed inset-y-0 left-0 z-50 w-72 max-w-[80vw] bg-white border-r border-slate-200 transform -translate-x-full transition-transform duration-300 ease-in-out lg:col-span-1 lg:relative lg:translate-x-0 lg:w-auto lg:max-w-none lg:bg-transparent lg:border-none lg:z-auto lg:inset-auto lg:block shadow-2xl lg:shadow-none">
    
    <!-- Close button for mobile drawer -->
    <div class="lg:hidden flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50">
      <span class="text-xs font-bold text-slate-800 uppercase tracking-wider">Navigation</span>
      <button id="mobile-sidebar-close" class="text-slate-500 hover:text-slate-800 text-xl font-bold px-2 py-1 cursor-pointer">
        <i class="bi bi-x-lg text-sm"></i>
      </button>
    </div>
    
    <!-- Sidebar inner content (removes extra padding/shadow on mobile to look neat inside container) -->
    <div class="h-[calc(100vh-60px)] lg:h-auto overflow-y-auto lg:overflow-visible p-4 lg:p-0">
      {% include 'components/sidebar.html' %}
    </div>
  </div>

  <!-- Mobile Sidebar Backdrop Overlay -->
  <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-slate-950/40 backdrop-blur-xs hidden lg:hidden opacity-0 transition-opacity duration-300 pointer-events-none"></div>

  <!-- Main Content Column -->
  <div class="lg:col-span-3">
    {% block dashboard_content %}{% endblock %}
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.getElementById('sidebar-container');
    const backdrop = document.getElementById('sidebar-backdrop');
    const openBtn = document.getElementById('mobile-sidebar-open');
    const closeBtn = document.getElementById('mobile-sidebar-close');

    if (sidebar && backdrop && openBtn && closeBtn) {
      function openSidebar() {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
        backdrop.classList.add('pointer-events-auto');
        // Force reflow
        backdrop.offsetWidth;
        backdrop.classList.add('opacity-100');
        document.body.classList.add('overflow-hidden');
      }

      function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.remove('opacity-100', 'pointer-events-auto');
        backdrop.classList.add('opacity-0');
        
        const transitionHandler = function() {
          backdrop.classList.add('hidden');
          backdrop.classList.remove('opacity-0');
          backdrop.removeEventListener('transitionend', transitionHandler);
        };
        backdrop.addEventListener('transitionend', transitionHandler);
        document.body.classList.remove('overflow-hidden');
      }

      openBtn.addEventListener('click', openSidebar);
      closeBtn.addEventListener('click', closeSidebar);
      backdrop.addEventListener('click', closeSidebar);
    }
  });
</script>
{% endblock %}
